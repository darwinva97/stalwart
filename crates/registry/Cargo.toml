[package]
name = "registry"
version = "1.1.0"
edition = "2024"

[dependencies]
utils = { path =  "../utils" }
trc = { path = "../trc" }
types = { path = "../types" }
serde = { version = "1.0", features = ["derive"]}
hashify = "0.3"
ahash = { version = "0.8" }
jmap-tools = { path = "../jmap-tools" }
mail-auth = { version = "0.15.1" }
smtp-report = { path = "../smtp-report" }
tokio = { version = "1.54", features = ["fs"] }
lz4_flex = { version = "0.14", features = ["alloc"], default-features = false }
compact_str = "0.10.0"

[dev-dependencies]
serde_json = "1.0"

[features]
enterprise = ["trc/enterprise", "utils/enterprise"]
# bezenti: modelo de datos de las funciones Enterprise reimplementadas como AGPL (bezenti/generador).
bezenti = ["trc/bezenti"]

[lints]
workspace = true
